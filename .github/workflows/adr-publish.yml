name: Deploy ADRs
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IMPORTANT: v1.1.0 needs history for the timeline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Log4brains
        run: |
          # Install the specific version you're using
          npm install -g log4brains@1.1.0
          # The repo name is usually the sub-path. 
          # Use your actual repo name here (e.g., /cqrs-experiment)
          log4brains build --basePath /${{ github.event.repository.name }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.log4brains/out
          nojekyll: true
          clean: true