name: Build and Deploy Docs
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        run: |
          npm install -g log4brains@1.1.0
          cd website && npm install

      - name: Build Log4brains
        # The basePath must match the URL path: /repo-name/folder/
        run: |
          log4brains build --basePath /cqrs/adr
          mkdir -p website/static/adr
          cp -r .log4brains/out/* website/static/adr/

      - name: Build Docusaurus
        run: |
          cd website
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Docusaurus output is always in the /build folder of the site dir
          publish_dir: ./website/build 
          nojekyll: true